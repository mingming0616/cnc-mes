<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNC MES</title>
<!-- 英文與數字用 Barlow Semi Condensed（工業標示風格），中文用系統字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<!-- ?v=2：style.css 有改版時把數字加 1，瀏覽器才會抓新的樣式 -->
<link rel="stylesheet" href="style.css?v=2">
<style>
  /* 功能⑥：從機台頁來時，登入框上方的提醒（只有這頁用，不另外改 style.css） */
  .login-next {
    margin: 0; padding: 10px 12px; font-size: 15px;
    background: var(--sunk); border-left: 4px solid var(--ink); border-radius: 4px;
  }
</style>
</head>
<body>

<!-- ========== 載入中／連線錯誤 ========== -->
<div id="view-loading" class="loading">
  <p id="loading-text">連線中…</p>
  <button id="btn-retry" class="btn" type="button" hidden>重新整理</button>
</div>

<!-- ========== 登入畫面 ========== -->
<main id="view-login" class="login" hidden>
  <form id="login-form" class="plate" novalidate>
    <div class="plate-head">
      <p class="brand brand-lg">CNC MES</p>
      <p class="plate-sub">工廠製造管理執行系統</p>
    </div>
    <!-- 功能⑥：從機台頁（掃 QR）過來時才出現 -->
    <p id="login-next" class="login-next" hidden></p>
    <label class="field">
      <span>工號</span>
      <input id="login-empno" type="text" autocomplete="username" autocapitalize="characters" spellcheck="false" maxlength="10">
    </label>
    <label class="field">
      <span>密碼</span>
      <input id="login-password" type="password" autocomplete="current-password">
    </label>
    <label class="check">
      <input id="login-keep" type="checkbox">
      <span>保持登入（公用平板不要勾）</span>
    </label>
    <p id="login-error" class="form-error" role="alert"></p>
    <button id="login-btn" class="btn primary block" type="submit">登入</button>
  </form>
</main>

<!-- ========== 首頁 ========== -->
<div id="view-home" hidden>
  <header class="topbar">
    <span class="brand">CNC MES</span>
    <span class="who"><span id="home-name"></span><span id="home-role" class="role-tag"></span></span>
    <span class="topbar-actions">
      <button id="btn-password" class="btn ghost" type="button">修改密碼</button>
      <button id="btn-logout" class="btn ghost" type="button">登出</button>
    </span>
  </header>
  <main class="page">
    <!-- 只有管理者、而且預設資料還沒建立時才出現 -->
    <section id="setup-card" class="setup" hidden>
      <h2>第一次使用：建立預設資料</h2>
      <p>會建立銑床課（9 種狀態和原因清單）以及班別設定。已經有的資料不會被覆蓋。</p>
      <button id="btn-setup" class="btn primary" type="button">建立預設資料</button>
    </section>
    <!-- 只有管理者、而且單位設定還沒更新時才出現（功能⑩：新增「借出」狀態）；按一次就好 -->
    <section id="upgrade-card" class="setup" hidden>
      <h2>設定更新：新增「借出」狀態</h2>
      <p>銑床課會多一個狀態「借出」（原因選借用單位：生技課、其他），借出時間不算銑床課的稼動率；
        「停用」下面的原因「借出」會關掉（以前的紀錄照樣看得到）。其他設定不會變動。</p>
      <button id="btn-upgrade" class="btn primary" type="button">更新設定</button>
    </section>
    <nav id="module-keys" class="keys" aria-label="功能"></nav>
  </main>
</div>

<!-- ========== 修改密碼視窗 ========== -->
<dialog id="dlg-password">
  <form id="password-form" class="dialog-body" novalidate>
    <h2>修改密碼</h2>
    <label class="field"><span>目前密碼</span><input id="pw-current" type="password" autocomplete="current-password"></label>
    <label class="field"><span>新密碼（至少 8 碼）</span><input id="pw-new" type="password" autocomplete="new-password"></label>
    <label class="field"><span>再輸入一次新密碼</span><input id="pw-confirm" type="password" autocomplete="new-password"></label>
    <p id="pw-error" class="form-error" role="alert"></p>
    <div class="row-actions">
      <button id="pw-cancel" class="btn" type="button">取消</button>
      <button id="pw-save" class="btn primary" type="submit">儲存新密碼</button>
    </div>
  </form>
</dialog>

<script type="module">
// ============================================================
// index.html：登入畫面＋首頁
//   功能⑥：網址帶 ?next=machine&machineId=設備編號（機台頁沒登入時帶過來）
//     → 登入後直接回到那台機的機台頁，不進首頁
//   功能⑩：預設資料加上狀態「借出」；已經建好的銑床課用「設定更新」按鈕補上（按一次就好）
// ============================================================
import {
  db, doc, getDoc, getDocFromServer, writeBatch, serverTimestamp,
  watchAuth, login, logout, loadProfile, changePassword, myEmpNo,
  normalizeEmpNo, EMPNO_PATTERN, ROLE_LABELS, errorMessage, toast, setBusy
} from './common.js';

const $ = (id) => document.getElementById(id);

// 首頁的模組按鍵：roles＝哪些角色看得到；href 是 null 代表還沒做（顯示「準備中」）
const MODULES = [
  { label: '設備看板', desc: '即時機台狀態', href: 'board.html', roles: ['admin', 'maintainer', 'viewer'] },
  { label: '主檔維護', desc: '設備、樓層', href: 'master.html', roles: ['admin'] },
  { label: '人員管理', desc: '帳號、角色、負責單位', href: 'users.html', roles: ['admin'] }
];

// 原因清單小工具：[['代碼', '名稱'], ...] → [{ code, label, active }]
const reasons = (pairs) => pairs.map(([code, label]) => ({ code, label, active: true }));

// 功能⑩「借出」狀態：機台留在原位、暫時借給別的單位用；借出時間不算銑床課稼動率（group: excluded）
//   原因＝借用單位（必選）；顏色暫定青色，之後可再改
const LENT_STATUS = { code: 'lent', label: '借出', color: '#26C6DA', group: 'excluded', needsReason: 'required', alert: false };
const LENT_REASONS = reasons([['prodTech', '生技課'], ['other', '其他']]);

// 「建立預設資料」要寫入的銑床課設定（對應「資料結構說明」第一階段 v1.9）
//   group：稼動率分組 operating 稼動／loss 停機損失／planned 計畫內停機／excluded 不列入產能
//   needsReason：原因 required 必選／optional 選填／none 不用選
//   alert：切到這個狀態時要不要跳出提醒
const DEFAULT_MILLING = {
  name: '銑床課',
  sortOrder: 1,
  active: true,
  statuses: [
    { code: 'running',     label: '生產中',   color: '#2E9E4F', group: 'operating', needsReason: 'none',     alert: false },
    { code: 'setup',       label: '架機中',   color: '#2F6FDE', group: 'loss',      needsReason: 'none',     alert: false },
    { code: 'waiting',     label: '待機',     color: '#E8B400', group: 'loss',      needsReason: 'required', alert: false },
    { code: 'fault',       label: '故障',     color: '#D93025', group: 'loss',      needsReason: 'required', alert: true },
    { code: 'qualityHold', label: '品質異常', color: '#F07C00', group: 'loss',      needsReason: 'required', alert: true },
    { code: 'maintenance', label: '保養中',   color: '#8E44AD', group: 'planned',   needsReason: 'optional', alert: false },
    { code: 'idle',        label: '無排產',   color: '#9AA0A6', group: 'planned',   needsReason: 'none',     alert: false },
    { code: 'offline',     label: '停用',     color: '#5F6368', group: 'excluded',  needsReason: 'required', alert: false },
    LENT_STATUS
  ],
  reasons: {
    waiting: reasons([['material', '待料'], ['tool', '待刀具'], ['fixture', '待治具'], ['program', '待程式'],
                      ['manpower', '待人員'], ['firstArticle', '待首件'], ['instruction', '待指示']]),
    fault: reasons([['spindle', '主軸'], ['atc', '刀庫／換刀'], ['hydraulic', '油壓／氣壓'], ['coolant', '冷卻／排屑'],
                    ['electrical', '電控'], ['crash', '撞機'], ['other', '其他']]),
    qualityHold: reasons([['dimension', '尺寸不良'], ['appearance', '外觀不良'], ['other', '其他']]),
    maintenance: reasons([['pm', '定期保養'], ['inspection', '點檢']]),
    // 「停用」下面的「借出」改用獨立的「借出」狀態，這裡關掉（active: false）；代碼留著，舊紀錄才看得懂
    offline: [{ code: 'lent', label: '借出', active: false },
              ...reasons([['installation', '安裝驗收'], ['relocation', '搬遷'], ['scrap', '待報廢']])],
    lent: LENT_REASONS
  }
};

// ---------- 單位設定更新（已經建好的銑床課要補的東西；按一次就好，按過按鈕就不會再出現） ----------
// 功能⑩：新增「借出」狀態＋借用單位原因；「停用」下面的「借出」原因關掉
//   只補缺的，不動其他狀態、原因（之後在畫面上改過的顏色、名稱都保留）
function needsLentUpgrade(dept) {
  return !(dept.statuses || []).some((s) => s.code === 'lent');
}
function withLent(dept) {
  const statuses = [...(dept.statuses || [])];
  const at = statuses.findIndex((s) => s.code === 'offline');
  statuses.splice(at >= 0 ? at + 1 : statuses.length, 0, { ...LENT_STATUS });   // 放在「停用」後面
  const reasonsNow = { ...(dept.reasons || {}) };
  reasonsNow.offline = (reasonsNow.offline || []).map((r) => (r.code === 'lent' ? { ...r, active: false } : r));
  if (!Array.isArray(reasonsNow.lent) || !reasonsNow.lent.length) reasonsNow.lent = LENT_REASONS.map((r) => ({ ...r }));
  return { statuses, reasons: reasonsNow };
}

// 班別設定：生產日從 08:00 起算，夜班整班算上班那天
const DEFAULT_SHIFTS = {
  timezone: 'Asia/Taipei',
  dayStartTime: '08:00',
  shifts: [
    {
      id: 'D', name: '早班', start: '08:00', end: '20:00',
      work: [{ start: '08:00', end: '12:00' }, { start: '13:00', end: '17:00' }],
      breaks: [{ start: '12:00', end: '13:00' }, { start: '17:00', end: '17:30' }],
      overtime: [{ start: '17:30', end: '20:00' }]
    },
    {
      id: 'N', name: '夜班', start: '20:00', end: '08:00',
      work: [{ start: '20:00', end: '00:00' }, { start: '01:00', end: '05:00' }],
      breaks: [{ start: '00:00', end: '01:00' }, { start: '05:00', end: '05:30' }],
      overtime: [{ start: '05:30', end: '08:00' }]
    }
  ]
};

let pendingMessage = '';   // 下次顯示登入畫面時要出現的提示

// 功能⑥：從機台頁來的，登入後回到那台機（只接受機台頁，設備編號格式不對就照常進首頁）
const returnUrl = (() => {
  const params = new URLSearchParams(location.search);
  if (params.get('next') !== 'machine') return '';
  const id = String(params.get('machineId') || '').trim().toUpperCase();
  return /^[A-Z0-9][A-Z0-9-]{1,11}$/.test(id) ? `machine.html?machineId=${encodeURIComponent(id)}` : '';
})();
if (returnUrl) {
  const id = new URLSearchParams(returnUrl.split('?')[1]).get('machineId');
  $('login-next').textContent = `登入後會回到機台 ${id}。個人手機請勾「保持登入」，之後掃碼就不用再登入。`;
  $('login-next').hidden = false;
}

// 別的頁面把人登出時，會在網址帶 ?msg=inactive 回來
if (new URLSearchParams(location.search).get('msg') === 'inactive') {
  pendingMessage = '帳號未啟用，請找管理者';
  history.replaceState(null, '', location.pathname);   // 清掉網址參數
}

// 三個畫面一次只顯示一個
function show(viewId) {
  for (const id of ['view-loading', 'view-login', 'view-home']) {
    $(id).hidden = id !== viewId;
  }
}

function setLoginError(message) { $('login-error').textContent = message; }
function setPwError(message) { $('pw-error').textContent = message; }

// ---------- 登入狀態改變時（開網頁、登入、登出都會跑這段） ----------
watchAuth(async (user) => {
  if (!user) {
    setLoginError(pendingMessage);
    pendingMessage = '';
    show('view-login');
    return;
  }
  $('loading-text').textContent = '讀取人員資料…';
  $('btn-retry').hidden = true;
  show('view-loading');
  try {
    const profile = await loadProfile(user);
    if (!profile || profile.active !== true) {
      pendingMessage = '帳號未啟用，請找管理者';
      await logout();   // 登出後會再跑一次這段，顯示登入畫面和提示
      return;
    }
    if (returnUrl) {     // 功能⑥：從機台頁來的，直接回到那台機
      location.replace(returnUrl);
      return;
    }
    renderHome(profile);
    show('view-home');
  } catch (err) {
    // 多半是網路問題：保留登入狀態，讓使用者按重新整理
    $('loading-text').textContent = errorMessage(err);
    $('btn-retry').hidden = false;
  }
});

$('btn-retry').addEventListener('click', () => location.reload());

// ---------- 登入 ----------
$('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const empNo = normalizeEmpNo($('login-empno').value);
  const password = $('login-password').value;
  if (!EMPNO_PATTERN.test(empNo)) { setLoginError('工號是英文或數字，2～10 碼'); return; }
  if (!password) { setLoginError('請輸入密碼'); return; }
  setLoginError('');
  setBusy($('login-btn'), true, '登入中…');
  try {
    await login(empNo, password, $('login-keep').checked);
    $('login-password').value = '';
    // 登入成功後，上面的 watchAuth 會自動切到首頁（從機台頁來的，回到那台機）
  } catch (err) {
    setLoginError(errorMessage(err));
  } finally {
    setBusy($('login-btn'), false);
  }
});

// ---------- 首頁 ----------
function renderHome(profile) {
  $('home-name').textContent = profile.name;
  $('home-role').textContent = ROLE_LABELS[profile.role] || profile.role;
  $('module-keys').innerHTML = MODULES
    .filter((m) => m.roles.includes(profile.role))
    .map((m) => m.href
      ? `<a class="key" href="${m.href}"><span class="key-label">${m.label}</span><span class="key-desc">${m.desc}</span></a>`
      : `<div class="key is-soon" aria-disabled="true"><span class="key-label">${m.label}</span><span class="key-desc">${m.desc}</span><span class="soon">準備中</span></div>`)
    .join('');
  if (profile.role === 'admin') {
    checkSetup();
  } else {
    $('setup-card').hidden = true;
  }
}

// 管理者：檢查預設資料建了沒，沒建才顯示「建立預設資料」
async function checkSetup() {
  try {
    const [dept, shifts] = await Promise.all([
      getDoc(doc(db, 'departments', 'milling')),
      getDoc(doc(db, 'settings', 'shifts'))
    ]);
    $('setup-card').hidden = dept.exists() && shifts.exists();
    $('upgrade-card').hidden = !(dept.exists() && needsLentUpgrade(dept.data()));
  } catch (err) {
    $('setup-card').hidden = true;
    $('upgrade-card').hidden = true;
    toast(errorMessage(err), 'error');
  }
}

$('btn-setup').addEventListener('click', async () => {
  if (!confirm('要建立銑床課和班別的預設資料嗎？已經有的資料不會被覆蓋。')) return;
  setBusy($('btn-setup'), true, '建立中…');
  try {
    const deptRef = doc(db, 'departments', 'milling');
    const shiftsRef = doc(db, 'settings', 'shifts');
    const [dept, shifts] = await Promise.all([getDoc(deptRef), getDoc(shiftsRef)]);
    const stamp = { updatedAt: serverTimestamp(), updatedByEmpNo: myEmpNo() };   // 誰、什麼時候建的
    const batch = writeBatch(db);   // 一次寫入，不會只寫一半
    if (!dept.exists()) batch.set(deptRef, { ...DEFAULT_MILLING, ...stamp });
    if (!shifts.exists()) batch.set(shiftsRef, { ...DEFAULT_SHIFTS, ...stamp });
    await batch.commit();
    $('setup-card').hidden = true;
    toast('預設資料已建立');
  } catch (err) {
    toast(errorMessage(err), 'error');
  } finally {
    setBusy($('btn-setup'), false);
  }
});

// 功能⑩：銑床課補上「借出」狀態（只按一次；先跟資料庫確認最新內容，已經補過就不再寫）
$('btn-upgrade').addEventListener('click', async () => {
  if (!confirm('要幫銑床課新增「借出」狀態嗎？\n「停用」下面的原因「借出」會關掉，以前的紀錄照樣看得到。')) return;
  setBusy($('btn-upgrade'), true, '更新中…');
  try {
    const deptRef = doc(db, 'departments', 'milling');
    const dept = await getDocFromServer(deptRef);   // 一定要有網路：用資料庫最新的內容來改
    if (!dept.exists()) throw new Error('找不到銑床課，請先按「建立預設資料」');
    if (needsLentUpgrade(dept.data())) {
      const batch = writeBatch(db);
      batch.update(deptRef, { ...withLent(dept.data()), updatedAt: serverTimestamp(), updatedByEmpNo: myEmpNo() });
      await batch.commit();
      toast('已新增「借出」狀態');
    } else {
      toast('已經更新過了，不用再按');
    }
    $('upgrade-card').hidden = true;
  } catch (err) {
    toast(err.code ? errorMessage(err) : err.message, 'error');
  } finally {
    setBusy($('btn-upgrade'), false);
  }
});

// ---------- 登出 ----------
$('btn-logout').addEventListener('click', () => logout());

// ---------- 修改密碼 ----------
$('btn-password').addEventListener('click', () => {
  $('password-form').reset();
  setPwError('');
  $('dlg-password').showModal();
});
$('pw-cancel').addEventListener('click', () => $('dlg-password').close());

$('password-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const current = $('pw-current').value;
  const next = $('pw-new').value;
  if (!current) { setPwError('請輸入目前密碼'); return; }
  if (next.length < 8) { setPwError('新密碼至少要 8 碼'); return; }
  if (next !== $('pw-confirm').value) { setPwError('兩次輸入的新密碼不一樣'); return; }
  if (next === current) { setPwError('新密碼不能和目前密碼一樣'); return; }
  setPwError('');
  setBusy($('pw-save'), true, '儲存中…');
  try {
    await changePassword(current, next);
    $('dlg-password').close();
    toast('密碼已更新，下次請用新密碼登入');
  } catch (err) {
    const wrongPassword = ['auth/invalid-credential', 'auth/wrong-password'].includes(err?.code);
    setPwError(wrongPassword ? '目前密碼不對' : errorMessage(err));
  } finally {
    setBusy($('pw-save'), false);
  }
});
</script>
</body>
</html>
